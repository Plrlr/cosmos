name: Build Cosmos APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

# Publishing the update release needs write access to repository contents; the
# default token is read-only under some repository settings, so be explicit.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK
        run: |
          export ANDROID_HOME="$HOME/android-sdk"
          export ANDROID_SDK_ROOT="$HOME/android-sdk"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL -o cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Build debug APK
        env:
          # Stamped into the APK as its versionCode (see app/build.gradle); the
          # run number only ever grows, so each build installs over the last.
          COSMOS_VERSION_CODE: ${{ github.run_number }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cosmos-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # The app's update channel. Actions artifacts cannot serve it: their zip
      # endpoint answers "401 Requires authentication" to an unauthenticated
      # client even for a public repo (verified with curl), and they expire
      # after 90 days. Release assets download anonymously and for good, so the
      # updater points at the newest release instead.
      - name: Publish the update release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: build-${{ github.run_number }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk cosmos-debug.apk
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "Cosmos 1.7 (build ${{ github.run_number }})" \
              --notes "Debug-signed APK for the Cosmos in-app updater. The number in the tag is the APK's versionCode."
          fi
          gh release upload "$TAG" cosmos-debug.apk --clobber
          echo "Update channel now serves $TAG" >> "$GITHUB_STEP_SUMMARY"
